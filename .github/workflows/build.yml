name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Core 테스트
        run: dotnet run --project tests/CoreTest

      - name: exe 빌드
        run: dotnet publish src/App/ShopHelper.csproj -c Release -o out

      - name: 배포 폴더 만들기
        run: |
          mkdir -p dist/ShopHelper
          cp out/ShopHelper.exe dist/ShopHelper/
          cp 사용법.txt dist/ShopHelper/
          dotnet run --project tests/CoreTest -- --write-config dist/ShopHelper/config.json
          cd dist && zip -qr ShopHelper.zip ShopHelper

      - uses: actions/upload-artifact@v4
        with:
          name: ShopHelper
          path: dist/ShopHelper

      - name: 릴리스 올리기 (v 태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShopHelper.zip
          body: ShopHelper.zip 을 받아 압축을 풀고 ShopHelper.exe 를 실행하세요. 설치할 것은 없습니다.
